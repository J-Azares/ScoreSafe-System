<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScoreSafe | Record</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="page-wrapper">
<header class="topbar">
  <div class="container nav-wrapper">
    <div class="logo">ScoreSafe</div>
    <div class="hamburger" id="hamburger">&#9776;</div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-tachometer-alt icon-label"></i> Dashboard</a>
      <a class="active" href="record.html"><i class="fas fa-chart-line icon-label"></i> Record</a>
      <a href="profile.html"><i class="fas fa-user icon-label"></i> Profile</a>
      <a href="#" class="mobile-only logout-btn"><i class="fas fa-sign-out-alt icon-label"></i> Sign out</a>
    </nav>
    <div class="header-actions">
      <a href="#" class="btn outline logout-btn" title="Logout"><i class="fas fa-sign-out-alt icon-label"></i> <span class="logout-label">Sign out</span></a>
    </div>
  </div>
</header>

<main class="container">
  <section class="card table-section" style="padding: 0; overflow: visible; margin-top: 20px;">
    <div class="table-header" style="padding: 24px 32px;">
      <h3><i class="fas fa-list-ul icon-label"></i> All Scores & Papers</h3>
      <div class="search-container" style="width: 400px; margin-left: auto;">
<div class="search-container" style="width: 400px; margin-left: auto;">
    <input type="text" id="recordsSearch" class="table-search" placeholder="Search my records..." data-table="#myRecordsTable">
    <button type="button" class="filter-btn"><i class="fas fa-filter"></i></button>
    <div class="filter-menu">
        <div class="filter-header">Category</div>
        <div class="filter-item" onclick="applyFilter('#myRecordsTable', 'reset', '')">All</div>
        <div class="filter-item" onclick="applyFilter('#myRecordsTable', 'category', 'Quiz')">Quizzes</div>
        <div class="filter-item" onclick="applyFilter('#myRecordsTable', 'category', 'Activity')">Activities</div>
        <div class="filter-item" onclick="applyFilter('#myRecordsTable', 'category', 'Performance')">Performance</div>
        <div class="filter-item" onclick="applyFilter('#myRecordsTable', 'category', 'Examination')">Exams</div>
    </div>
</div>
      </div>
    </div>
    <div class="table-wrapper">
      <table id="myRecordsTable">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Total Score</th>
            <th>Total Item</th>
            <th>Paper</th>
            <th>Category</th>
            <th>Recorded By</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
<tbody>
    <tr class="empty-row"><td colspan="8" style="text-align: center; padding: 40px; color: #999;">No records yet</td></tr>
</tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-container">
    <p>&copy; 2026 ScoreSafe. All rights reserved.</p>
  </div>
</footer>

<script src="../js/config.js"></script>
<script src="../js/student.js"></script>
</body>
</html>

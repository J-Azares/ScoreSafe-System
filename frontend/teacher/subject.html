<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreSafe | Subject Management</title>
    <script src="../js/guard.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav-wrapper">
            <div class="logo">ScoreSafe</div>
            <div class="hamburger" id="hamburger">&#9776;</div>
            <nav>
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="student.html"><i class="fas fa-user-graduate"></i> Student</a>
                <a class="active" href="subject.html"><i class="fas fa-book"></i> Subject</a>
                <a href="record-score.html"><i class="fas fa-plus-circle"></i> Record</a>
                <a href="faculty.html"><i class="fas fa-user-shield"></i> Faculty</a>
                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="#" class="mobile-only logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</a>
            </nav>
            <div class="header-actions">
                <a href="#" class="btn outline logout-btn">
                    <i class="fas fa-sign-out-alt"></i> <span class="logout-label">Sign out</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div class="auth-header" style="text-align: left; margin-bottom: 20px;">
                <h3><i class="fas fa-folder-plus icon-label"></i> Add New Subject</h3>
            </div>
            <form id="addSubjectForm">
                <div class="form-group">
                    <label for="subjectName"><i class="fas fa-book icon-label"></i> Subject Name</label>
                    <input type="text" id="subjectName" placeholder="e.g. Mathematics 101" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-plus"></i> Add Subject</button>
            </form>
        </section>

        <section class="card table-section" style="margin-top: 20px;">
            <div class="table-header">
                <h3>Current Subjects</h3>
                <div class="search-container">
                    <input type="text" id="searchInput" class="table-search" placeholder="Search subjects...">
                    <button type="button" class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="subjectsTable">
                    <thead>
                        <tr>
                            <th>Subject Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
<tbody id="subjectTableBody">
    <tr class="empty-row">
        <td colspan="2" style="text-align: center; padding: 30px; color: #999;">
            No subjects yet
        </td>
    </tr>
</tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; 2026 ScoreSafe. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/teacher.js"></script>
</body>
</html>

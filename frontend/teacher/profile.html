<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>ScoreSafe | My Profile</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
</head>
<body>

<header class="topbar">
  <div class="container nav-wrapper">
    <div class="logo">ScoreSafe</div>
    <div class="hamburger" id="hamburger">&#9776;</div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="student.html"><i class="fas fa-user-graduate"></i> Student</a>
      <a href="subject.html"><i class="fas fa-book"></i> Subject</a>
      <a href="record-score.html"><i class="fas fa-plus-circle"></i> Record</a>
      <a href="faculty.html"><i class="fas fa-user-shield"></i> Faculty</a>
      <a class="active" href="profile.html"><i class="fas fa-user"></i> Profile</a>
      <a href="#" class="mobile-only logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</a>
    </nav>
    <div class="header-actions">
      <a href="#" class="btn outline logout-btn"><i class="fas fa-sign-out-alt"></i> <span class="logout-label">Sign out</span></a>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="profile-card" style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">
      
      <div class="profile-avatar" style="flex: 0 0 200px;">
        <div class="avatar-wrapper" id="teacherAvatarPreview" style="width: 200px; height: 200px; background: #f0f0f0; border: 3px solid var(--primary-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
          <i class="fas fa-user-circle" style="font-size: 5rem; color: #ccc;"></i>
        </div>
      </div>

      <div class="profile-info" style="flex: 1; min-width: 300px;">
        <form id="teacherProfileForm">
          <div class="form-group">
            <label for="teacherFullName"><i class="fas fa-user icon-label"></i> Full name</label>
            <input id="teacherFullName" type="text" placeholder="Your name will appear here" />
          </div>

          <div class="form-group">
            <label for="teacherEmail"><i class="fas fa-envelope icon-label"></i> Email</label>
            <input id="teacherEmail" type="email" readonly style="background: #f9f9f9; cursor: not-allowed;" />
          </div>

          <div class="form-group">
            <label for="teacherBio"><i class="fas fa-briefcase icon-label"></i> Bio / Department</label>
            <input id="teacherBio" type="text" placeholder="e.g. Senior High School Department" />
          </div>

          <div class="form-group">
            <label for="teacherAvatar"><i class="fas fa-image icon-label"></i> Change Profile Photo</label>
            <input id="teacherAvatar" type="file" accept="image/*" />
          </div>

          <div class="profile-actions" style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn" id="saveTeacherProfile"><i class="fas fa-save"></i> Save Changes</button>
            <button type="button" class="btn outline" id="resetTeacherProfile"><i class="fas fa-undo"></i> Reset</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
    <div class="container footer-container">
        <p>&copy; 2026 ScoreSafe. All rights reserved.</p>
    </div>
</footer>

<div id="cropperModal" class="modal-overlay" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal" style="background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px;">
        <h3 style="margin-bottom: 15px;">Crop Profile Photo</h3>
        <div style="max-height: 400px; background: #000; overflow: hidden;">
            <img id="imageToCrop" style="max-width: 100%;">
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" class="btn outline" id="cancelCrop">Cancel</button>
            <button type="button" class="btn" id="confirmCrop">Apply & Save</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/teacher.js"></script>
</body>
</html>

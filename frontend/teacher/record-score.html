<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreSafe | Record Score</title>
    <script src="../js/guard.js"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
    <header class="topbar">
        <div class="container nav-wrapper">
            <div class="logo">ScoreSafe</div>
            <div class="hamburger" id="hamburger">&#9776;</div>
            <nav>
                <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="enrollment.html"><i class="fas fa-users-cog"></i> Enrollment</a>
                <a href="student.html"><i class="fas fa-user-graduate"></i> Student</a>
                <a href="subject.html"><i class="fas fa-book"></i> Subject</a>
                <a class="active" href="record-score.html"><i class="fas fa-plus-circle"></i> Record</a>
                <a href="faculty.html"><i class="fas fa-user-shield"></i> Faculty</a>
                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                <a href="#" class="mobile-only logout-btn"><i class="fas fa-sign-out-alt"></i> Sign out</a>
            </nav>
            <div class="header-actions">
                <a href="#" class="btn outline logout-btn">
                    <i class="fas fa-sign-out-alt"></i> <span class="logout-label">Sign out</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div class="auth-header" style="text-align: left; margin-bottom: 20px;">
                <h3><i class="fas fa-pen-nib icon-label"></i> Record New Score</h3>
            </div>
            <form id="recordScoreForm">
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="studentSelect">Student</label>
                        <select id="studentSelect" required>
                            <option value="">-- Select Student --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subjectSelect">Subject</label>
                        <select id="subjectSelect" required>
                            <option value="">-- Select Subject --</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 15px;">
                    <div class="form-group">
                        <label for="categorySelect">Category</label>
                        <select id="categorySelect" required>
                            <option value="">-- Category --</option>
                            <option value="Quiz">Quiz</option>
                            <option value="Activity">Activity</option>
                            <option value="Performance">Performance</option>
                            <option value="Examination">Examination</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="totalItemsInput">Total Items</label>
                        <input type="number" id="totalItemsInput" placeholder="Enter total items" required>
                    </div>
                    <div class="form-group">
                        <label for="score">Student Score</label>
                        <input type="number" id="score" placeholder="Enter student's score" required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="paperFile">Evidence / Paper Image</label>
                    <input type="file" id="paperFile" accept="image/*">
                </div>

                <button type="submit" class="btn" style="margin-top: 10px;"><i class="fas fa-save"></i> Save Record</button>
            </form>
        </section>

        <section class="card table-section" style="margin-top: 20px;">
            <div class="table-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Recorded Scores</h3>
                <div class="search-container" style="display: flex; position: relative;">
                    <input type="text" id="searchInput" class="table-search" placeholder="Search records..." data-table="#scoresTable">
                    <button type="button" class="filter-btn" style="background: #800000; color: white; border: none; width: 45px; height: 45px; border-radius: 4px; margin-left: 10px; cursor: pointer;">
                        <i class="fas fa-filter"></i>
                    </button>
                    <div class="filter-menu">
    <div class="filter-header">Category</div>
    <div class="filter-item" onclick="applyFilter('#scoresTable', 'reset', '')">All</div>
    <div class="filter-item" onclick="applyFilter('#scoresTable', 'category', 'Quiz')">Quizzes</div>
    <div class="filter-item" onclick="applyFilter('#scoresTable', 'category', 'Activity')">Activities</div>
    <div class="filter-item" onclick="applyFilter('#scoresTable', 'category', 'Performance')">Performance</div>
    <div class="filter-item" onclick="applyFilter('#scoresTable', 'category', 'Examination')">Exams</div>
</div>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="scoresTable">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Subject</th>
                            <th>Score</th>
                            <th>Total</th>
                            <th>Paper</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="empty-row"><td colspan="8">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; 2026 ScoreSafe. All rights reserved.</p>
        </div>
    </footer>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/teacher.js"></script>
</body>
</html>

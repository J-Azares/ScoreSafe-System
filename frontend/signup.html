<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>ScoreSafe | Join</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<main class="container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-large">ScoreSafe</div>
                <p>Sign in with your Sorsu account to access the system.</p>
                <p style="font-size: 0.8rem; margin-top: 5px; color: #888;">Your role (Teacher/Student) is assigned automatically.</p>
            </div>

            <div id="loader" class="loader-container" style="display: none;">
                <div class="spinner"></div>
                <p>Verifying Account...</p>
            </div>

            <div id="googleBtnWrapper" style="margin-top: 20px; display: flex; justify-content: center;">
                <div id="g_id_onload"
                     data-client_id="200805836313-5980hgjr0tgoo8mrs6rsrrisl6lqma2s.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-width="400" data-theme="outline" data-size="large"></div>
            </div>

            <div class="form-footer" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <p>Already have an account? <a href="signin.html" style="color: var(--primary-color); font-weight: 600;">Sign in here</a></p>
            </div>
        </div>
    </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script> 
<script src="js/auth.js"></script>
</body>
</html>

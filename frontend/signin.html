<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>ScoreSafe | Sign in</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <main class="container">
        <div class="auth-container signin">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-large">ScoreSafe</div>
                    <p>Welcome back — sign in to continue to your dashboard</p>
                </div>
                <div id="loader" class="loader-container" style="display: none;">
    <div class="spinner"></div>
    <p>Signing in...</p>
</div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope icon-label"></i> Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group" style="position:relative">
                        <label for="password"><i class="fas fa-lock icon-label"></i> Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <div style="margin-top:6px;margin-bottom:8px">
                        <span id="loginMsg"></span>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt icon-label"></i> Sign In
                    </button>
                </form>

                <div style="text-align: center; margin: 20px 0; color: #888; font-size: 0.85rem; position: relative;">
                    <span style="background: #fff; padding: 0 15px; position: relative; z-index: 1; font-weight: 500;">OR</span>
                    <hr style="position: absolute; top: 50%; width: 100%; border: 0; border-top: 1px solid #eee; margin: 0;">
                </div>

                <div id="g_id_onload"
                     data-client_id="200805836313-5980hgjr0tgoo8mrs6rsrrisl6lqma2s.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                     data-type="standard" 
                     data-shape="rectangular" 
                     data-theme="outline" 
                     data-text="signin_with" 
                     data-size="large" 
                     data-logo_alignment="left"
                     data-width="400">
                </div>

                <div class="form-footer" style="margin-top: 25px;">
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <title>ScoreSafe | Sign in</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>  
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyBeoV8zLt1wPO_GW_K3hHjhwGuWFRmdshw",
    authDomain: "scoresafe-backend.firebaseapp.com",
    projectId: "scoresafe-backend",
    storageBucket: "scoresafe-backend.firebasestorage.app",
    messagingSenderId: "813508838073",
    appId: "1:813508838073:web:9a50b5c93d8a2239179168",
    measurementId: "G-JJEYYTE8GL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const API_BASE_URL = 'http://127.0.0.1:3000';

window.loginWithGoogle = async (mode = 'login') => {
    try {
        const result = await signInWithPopup(auth, provider);
        const idToken = await result.user.getIdToken();
        const email = result.user.email;

        if (!email.endsWith('@sorsu.edu.ph')) {
            alert("Access Denied: Please use your @sorsu.edu.ph email.");
            await auth.signOut();
            return;
        }

        const res = await fetch(`${API_BASE_URL}/api/auth/google-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: idToken })
        });

        const data = await res.json();

        if (res.status === 404) {
            sessionStorage.setItem('pendingEmail', email);
            sessionStorage.setItem('pendingToken', idToken);
            
            if (mode === 'login') {
                alert("Account not registered. Please register your account first.");
            }
            
            window.location.href = 'signup.html';
            

        } else if (res.ok) {
            localStorage.setItem('role', data.user.role);
            localStorage.setItem('username', data.user.username);
            
            if (data.user.role === 'student') {
                if (data.user.is_approved === 0) {
                    window.location.href = 'waiting.html';
                } else {
                    window.location.href = 'student/dashboard.html';
                }
            } else {
                window.location.href = 'teacher/dashboard.html';
            }
        }
} catch (err) {
        console.error(err);
        alert("Authentication failed. Please try again.");
    }
};

</script>

<main class="container">
    <div class="auth-container signin">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-large">ScoreSafe</div>
                <p>Access your university academic records</p>
            </div>

<button type="button" class="btn-primary" onclick="loginWithGoogle('login')" style="margin-top: 20px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px;">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
    Sign in with Sorsu Email
</button>

<div style="text-align: center; margin: 25px 0; color: #888; font-size: 0.8rem; position: relative;">
    <span style="background: #fff; padding: 0 10px; position: relative; z-index: 1;">OR</span>
    <hr style="position: absolute; top: 50%; width: 100%; border: 0; border-top: 1px solid #eee; margin: 0;">
</div>

<button type="button" class="btn-primary outline" onclick="loginWithGoogle('signup')" style="width: 100%; background: white; color: #800000; border: 2px solid #800000; padding: 12px; font-weight: bold;">
    Register Sorsu Email
</button>
            <div class="form-footer" style="margin-top: 25px; border-top: 1px solid #f5f5f5; padding-top: 15px;">
                <p style="font-size: 0.75rem; color: #999;">Authorized access for all Sorsogon State University campuses (Main, Bulan, Castilla, Magallanes).</p>
            </div>
        </div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
